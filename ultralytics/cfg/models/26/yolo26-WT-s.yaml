# Ultralytics YOLO26-Wave 🚀
# Novelty: Wavelet Backbone (Lossless Downsampling) + FreqGate (Attention Neck)

# Parameters
nc: 7 # GRAZPEDWRI-DX classes
end2end: True # YOLO26 NMS-Free mode
reg_max: 1 # Standard for YOLO26

# Scaling Constants
scales:
  #n: [0.50, 0.25, 1024]  # Nano: ~2.6M Params (Targeting G-YOLO Efficiency)
  s: [0.50, 0.50, 1024] # Small: ~10M Params (Targeting FracDet Accuracy)

# Backbone
backbone:
  # [from, repeats, module, args]
  # NOVELTY 1: WaveletDown at Input (Lossless Downsampling 640->320)
  - [-1, 1, WaveletDown, [64]] # 0-P1/2

  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]

  # NOVELTY 1: WaveletDown at P3 (Preserve Fracture Texture 160->80)
  - [-1, 1, WaveletDown, [256]] # 3-P3/8

  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3 Output

  # NOVELTY 1: WaveletDown at P4 (Preserve Edge Semantic 80->40)
  - [-1, 1, WaveletDown, [512]] # 5-P4/16

  - [-1, 2, C3k2, [512, True]] # 6-P4 Output
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10-P5 Output

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  # NOVELTY 2: FreqGate (Args [512] are dummy/placeholder, auto-scaled by c1)
  - [-1, 1, FreqGate, [512]] # 13
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]] # 16 cat backbone P3
  # NOVELTY 2: FreqGate (Args [256] are dummy/placeholder, auto-scaled by c1)
  - [-1, 1, FreqGate, [256]] # 17
  - [-1, 2, C3k2, [256, True]] # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 14], 1, Concat, [1]] # 20
  - [-1, 2, C3k2, [512, True]] # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 10], 1, Concat, [1]] # 23
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 (P5/32-large)

  # Detect Head
  - [[18, 21, 24], 1, Detect, [nc]]
